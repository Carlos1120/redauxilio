name: Laguna Publish Format (temporary)
on:
  push:
    branches:
      - feat/laguna-publicar-aprobado-20261120
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore(format): automated formatting')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run format
      - run: mvn -q spotless:apply
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(format): automated formatting"
            git push origin HEAD:refs/heads/feat/laguna-publicar-aprobado-20261120
          fi
