name: Laguna Publish Visual QA (branch only)
on:
  push:
    branches:
      - feat/laguna-publicar-aprobado-20261120
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: ./mvnw -B -q -DskipTests package
      - name: Start isolated H2 service
        shell: bash
        run: |
          nohup java -jar target/redauxilio-0.1.0-SNAPSHOT.jar \
            --server.port=18080 \
            '--spring.datasource.url=jdbc:h2:mem:laguna_visual;DB_CLOSE_DELAY=-1;MODE=PostgreSQL' \
            --redauxilio.demo.reports-enabled=false > /tmp/laguna-app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/laguna-app.log
          exit 1
      - name: Capture and assert four category flows
        run: node scripts/laguna-publish-visual.qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laguna-publish-visual-evidence
          path: laguna-visual-evidence/
          if-no-files-found: warn
      - name: Server logs on failure
        if: failure()
        run: tail -120 /tmp/laguna-app.log || true
